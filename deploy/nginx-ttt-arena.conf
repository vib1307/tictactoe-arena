# nginx site for the arena — server_setup.sh fills __SERVER_NAME__/__APP_PORT__
# and installs it as /etc/nginx/conf.d/ttt-arena.conf. certbot later adds the
# :443 / redirect lines to the installed copy.

# WebSocket upgrade only when the client asks for it.
map $http_upgrade $ttt_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name __SERVER_NAME__;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ttt_connection_upgrade;

        proxy_set_header Host $host;
        # Rate limiting is keyed on name+IP. uvicorn trusts X-Forwarded-For from
        # 127.0.0.1 only, so this makes gr.Request.client.host the real visitor
        # IP. $remote_addr (not $proxy_add_x_forwarded_for) so clients can't spoof it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Gradio streams game moves via server-sent events: don't buffer them,
        # and allow long-lived connections while models think.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
